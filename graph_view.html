<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#080f20;color:#e5edf9;font:14px 'Segoe UI',sans-serif}
#layout{height:805px;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;border:1px solid #293954;border-radius:16px;overflow:hidden;background:#0c1729}
#toolbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid #293954;background:#132139;flex-wrap:wrap;z-index:3}
#filter{margin-left:auto;width:170px}#search{max-width:240px;min-width:140px}#stage{grid-column:1;grid-row:2;position:relative;min-width:0;min-height:0;background:#091224}#graph{height:100%;width:100%}
#details{grid-column:2;grid-row:2/4;overflow:auto;background:#101b30;border-left:1px solid #293954;padding:24px}#details>h2{position:sticky;top:-24px;background:#101b30;padding:14px 0;z-index:1}
h2{font-size:22px;letter-spacing:-.035em;margin:8px 0}h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#90a6c6;margin:24px 0 10px}.muted{color:#9bacc6;font-size:12px;line-height:1.7}.eyebrow{font-size:10px;letter-spacing:.16em;color:#5de0ce;font-weight:700}.pill{display:inline-block;border:1px solid #34516a;padding:5px 9px;border-radius:20px;color:#64e2d1;font-size:11px}
button,select,input{font:inherit;color:#e5edf9;background:#172740;border:1px solid #344965;border-radius:8px;padding:10px 12px}button,select{cursor:pointer}button:hover{background:#253c5b;border-color:#5de0ce}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #5de0ce;outline-offset:2px}button:disabled{opacity:.4;cursor:default}
.item{display:block;width:100%;text-align:left;margin:9px 0 4px;line-height:1.5;min-height:48px;background:#182940}.edge{font-size:11px;color:#94c8d8;padding:7px 10px;min-height:32px;background:transparent;border-color:transparent}
#walk{grid-column:1;grid-row:3;padding:16px 20px;background:#13243b;border-top:1px solid #34516a}#walk[hidden]{display:none}#walk-title{margin:7px 0 12px;font-size:14px;line-height:1.5}#walk button{margin-right:6px}#follow{background:#57dac5;color:#08251f;border-color:#57dac5;font-weight:600}
#status{position:absolute;top:18px;left:20px;color:#90a6c6;font-size:11px;letter-spacing:.06em;pointer-events:none}#hint{position:absolute;bottom:16px;left:20px;right:20px;color:#9bacc6;font-size:11px;pointer-events:none;line-height:1.8}#error{position:absolute;inset:90px 25px auto;padding:20px;background:#402535;border:1px solid #ff8590;border-radius:12px;display:none;line-height:1.7}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.node-label{position:absolute;pointer-events:auto;max-width:150px;font-size:11px;padding:5px 8px;background:#101e32ed;border-color:#48647d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,10px)}p{line-height:1.65;overflow-wrap:anywhere}.legend{margin-top:22px;color:#9fb2ce;font-size:12px;line-height:2}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
@media(max-width:1000px){#layout{grid-template-columns:minmax(0,1fr) 290px}#toolbar{gap:6px;padding:10px}button,select,input{font-size:12px}#filter{margin-left:0;width:140px}}
@media(max-width:700px){#layout{grid-template-columns:1fr;grid-template-rows:auto minmax(250px,1fr) auto 230px}#toolbar{grid-column:1}#stage{grid-row:2}#walk{grid-row:3;padding:12px}#details{grid-column:1;grid-row:4;border-left:0;border-top:1px solid #293954;padding:16px}#details>h2{top:-16px}#search{max-width:170px}#walk button{padding:8px;font-size:11px}.node-label{max-width:110px;font-size:10px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.0/dist/3d-force-graph.min.js"></script>
</head><body><div id="layout"><div id="toolbar"><button id="fit">Fit view</button><button id="isolate" aria-pressed="true">Local view: on</button><button id="reset">Clear focus</button><button id="back" disabled>← Back</button><input id="filter" type="search" placeholder="Search concepts..." aria-label="Search concepts"><select id="search" aria-label="Fly to a concept"><option value="">Fly to a concept…</option></select></div><div id="stage"><div id="graph"></div><div id="labels"></div><div id="status" role="status">Preparing your 3D atlas…</div><div id="hint">DRAG to orbit &nbsp; / &nbsp; SCROLL to zoom &nbsp; / &nbsp; RIGHT-DRAG to pan<br>Arrows flow from prerequisite to dependent · Red connections indicate cycle flags</div><div id="error" role="alert"></div></div><div id="walk" hidden><span class="eyebrow">GUIDED CONNECTION WALK</span><div id="walk-title"></div><button id="previous-edge">Previous</button><button id="next-edge">Next</button><button id="follow">Go to concept</button><button id="inspect">Evidence</button></div><aside id="details" aria-live="polite"></aside></div>
<script>
const data=__PAYLOAD__;
const $=id=>document.getElementById(id), detail=$('details');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nodeMap=new Map(data.nodes.map(n=>[n.id,n]));
const endpoint=n=>typeof n==='object'?n.id:n;
const name=id=>{const n=nodeMap.get(id);return n?(data.labels==='Hindi only'?(n.hi||n.en):data.labels==='English only'?n.en:n.en+' · '+n.hi):id};
const colors={CH01:'#67b9ff',CH02:'#5de0bc',CH03:'#ffc77b'};
let graph,active=null,highlightNodes=new Set(),highlightEdges=new Set(),history=[],local=true,walkEdges=[],walkIndex=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduced?0:900;
function overview(){detail.innerHTML=`<span class="eyebrow">EXPLORE IN THREE DIMENSIONS</span><h2>A universe of<br>connected ideas.</h2><p class="muted">Use the search box to find a concept. Local view hides unrelated connections. Use Previous / Next and Go to concept to walk each connection. Select a concept to uncover what comes before it and where it leads. Follow any connection to move smoothly through the atlas.</p><span class="pill">${data.nodes.length} concepts · ${data.edges.length} connections</span><div class="legend"><span class="dot" style="background:#67b9ff"></span>CH01 · Knowing Our Numbers<br><span class="dot" style="background:#5de0bc"></span>CH02 · Whole Numbers<br><span class="dot" style="background:#ffc77b"></span>CH03 · Playing with Numbers</div><p class="muted">Relationships are model proposals and have not yet been academically validated.</p>`}
function refresh(){graph.nodeVisibility(n=>!local||!active||highlightNodes.has(n.id)).linkVisibility(e=>!local||!active||highlightEdges.has(e.id));graph.nodeColor(n=>active&&!highlightNodes.has(n.id)?'#25334b':colors[n.chapter]||'#b2bcdb').nodeVal(n=>n.id===active?3:1).linkColor(e=>e.cycle?'#ff7185':highlightEdges.has(e.id)?'#68ead8':active?'#223149':'#506886').linkWidth(e=>highlightEdges.has(e.id)?2:0.7).linkDirectionalParticles(e=>!reduced&&highlightEdges.has(e.id)?2:0)}
function fly(id){const n=nodeMap.get(id);if(!n||!Number.isFinite(n.x))return;graph.zoomToFit(duration,90,v=>highlightNodes.has(v.id))}
function updateWalk(){const e=walkEdges[walkIndex];$('walk').hidden=!e;if(!e)return;const other=endpoint(e.source)===active?endpoint(e.target):endpoint(e.source);$('walk-title').textContent=`${walkIndex+1} / ${walkEdges.length} ? ${endpoint(e.source)===active?'Leads to':'Prerequisite'}: ${name(other)}`;$('previous-edge').disabled=walkIndex===0;$('next-edge').disabled=walkIndex===walkEdges.length-1}
function record(id){if(active&&active!==id)history.push(active);$('back').disabled=!history.length;active=id}
function showNode(id,move=true,remember=true){const n=nodeMap.get(id);if(!n)return;if(remember)record(id);else active=id;
const incoming=data.edges.filter(e=>endpoint(e.target)===id),outgoing=data.edges.filter(e=>endpoint(e.source)===id);
highlightNodes=new Set([id]);highlightEdges=new Set();[...incoming,...outgoing].forEach(e=>{highlightNodes.add(endpoint(e.source));highlightNodes.add(endpoint(e.target));highlightEdges.add(e.id)});refresh();walkEdges=[...outgoing,...incoming];walkIndex=0;updateWalk();
const entries=(items,key)=>items.length?items.map(e=>`<button class="item" data-node="${esc(endpoint(e[key]))}">? ${esc(name(endpoint(e[key])))}</button><button class="edge" data-edge="${esc(e.id)}">Inspect relationship ↗</button>`).join(''):'<p class="muted">None in current view</p>';
detail.innerHTML=`<span class="eyebrow">CONCEPT INSPECTOR</span><h2>${esc(name(id))}</h2><span class="pill">${esc(n.chapter)}</span><p class="muted">${esc(id)}</p><h3>Prerequisites · ${incoming.length}</h3>${entries(incoming,'source')}<h3>Leads to · ${outgoing.length}</h3>${entries(outgoing,'target')}`;bind();detail.scrollTop=0;$('search').value=id;if(move)fly(id)}
function bind(){detail.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>showNode(b.dataset.node));detail.querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>showEdge(data.edges.find(e=>e.id===b.dataset.edge)))}
function showEdge(e){if(!e)return;const a=endpoint(e.source),b=endpoint(e.target);highlightNodes=new Set([a,b]);highlightEdges=new Set([e.id]);record(a);refresh();$('walk').hidden=true;detail.scrollTop=0;detail.innerHTML=`<span class="eyebrow">RELATIONSHIP INSPECTOR</span><h2>Follow the connection.</h2><button class="item" data-node="${esc(a)}">${esc(name(a))}</button><p class="muted">↓ is a prerequisite for</p><button class="item" data-node="${esc(b)}">${esc(name(b))}</button><h3>Reasoning</h3><p>${esc(e.reasoning||'Not provided')}</p><h3>Model confidence</h3><p>${esc(e.confidence||'Not provided')}</p><h3>Supporting passage IDs</h3><p>${esc(e.evidence||'Not provided')}</p><h3>Validation</h3><p>${esc(e.status||'Unreviewed')}${e.cycle?' · Cycle flagged':''}</p><p class="muted">Proposed relationship; not an academically confirmed fact.</p>`;bind();const s=nodeMap.get(a),t=nodeMap.get(b);if(Number.isFinite(s.x)&&Number.isFinite(t.x)){const mid={x:(s.x+t.x)/2,y:(s.y+t.y)/2,z:(s.z+t.z)/2};graph.cameraPosition({x:mid.x,y:mid.y,z:mid.z+Math.max(150,Math.hypot(s.x-t.x,s.y-t.y,s.z-t.z)*1.5)},mid,duration)}}
overview();
try{
if(typeof ForceGraph3D==='undefined')throw Error('The 3D renderer could not load. Check your internet connection and reload.');
graph=new ForceGraph3D($('graph'),{controlType:'orbit'}).backgroundColor('#091224').showNavInfo(false).nodeLabel(n=>esc(name(n.id))).nodeOpacity(.95).nodeRelSize(7).linkOpacity(.65).linkDirectionalArrowLength(3).linkDirectionalArrowRelPos(.92).linkDirectionalParticleWidth(1.5).linkHoverPrecision(12).linkLabel(e=>esc(name(endpoint(e.source))+' → '+name(endpoint(e.target)))).onNodeClick(n=>showNode(n.id)).onLinkClick(showEdge).onBackgroundClick(()=>{}).warmupTicks(70).cooldownTicks(120).graphData({nodes:data.nodes,links:data.edges});
graph.controls().enableDamping=true;graph.controls().dampingFactor=.08;refresh();
new ResizeObserver(()=>{graph.width($('stage').clientWidth).height($('stage').clientHeight)}).observe($('stage'));
let fitted=false;graph.onEngineStop(()=>{if(!fitted){fitted=true;graph.zoomToFit(duration,65);for(const n of data.nodes){n.fx=n.x;n.fy=n.y;n.fz=n.z}if(nodeMap.has(data.selected))showNode(data.selected);$('status').textContent=`3D LIVE / ${data.nodes.length} concepts / ${data.edges.length} connections`}});
for(const n of [...data.nodes].sort((a,b)=>a.en.localeCompare(b.en))){const option=document.createElement('option');option.value=n.id;option.textContent=name(n.id);$('search').append(option)}
$('search').onchange=e=>{if(e.target.value)showNode(e.target.value)};
$('fit').onclick=()=>graph.zoomToFit(duration,90,n=>!local||!active||highlightNodes.has(n.id));
$('isolate').onclick=()=>{local=!local;$('isolate').textContent='Local view: '+(local?'on':'off');$('isolate').setAttribute('aria-pressed',String(local));refresh();$('fit').click()};
$('filter').oninput=()=>{const query=$('filter').value.toLowerCase();for(const o of $('search').options)o.hidden=!!o.value&&!o.textContent.toLowerCase().includes(query)};
$('previous-edge').onclick=()=>{if(walkIndex>0)walkIndex--;updateWalk()};
$('next-edge').onclick=()=>{if(walkIndex<walkEdges.length-1)walkIndex++;updateWalk()};
$('follow').onclick=()=>{const e=walkEdges[walkIndex];if(e)showNode(endpoint(e.source)===active?endpoint(e.target):endpoint(e.source))};
$('inspect').onclick=()=>showEdge(walkEdges[walkIndex]);
const labelButtons=new Map();for(const n of data.nodes){const b=document.createElement('button');b.className='node-label';b.textContent=name(n.id);b.title=name(n.id);b.onclick=()=>showNode(n.id);$('labels').append(b);labelButtons.set(n.id,b)}
function positionLabels(){const camera=graph.camera(),direction=camera.getWorldDirection(camera.position.clone());for(const n of data.nodes){const b=labelButtons.get(n.id);if(!Number.isFinite(n.x)|| (local&&active&&!highlightNodes.has(n.id))){b.hidden=true;continue}const delta=camera.position.clone().set(n.x,n.y,n.z).sub(camera.position);if(delta.dot(direction)<=0){b.hidden=true;continue}const point=graph.graph2ScreenCoords(n.x,n.y,n.z);b.hidden=point.x<0||point.y<45||point.x>$('stage').clientWidth||point.y>$('stage').clientHeight-65;b.style.left=point.x+'px';b.style.top=point.y+'px'}requestAnimationFrame(positionLabels)}positionLabels();
$('reset').onclick=()=>{active=null;highlightNodes.clear();highlightEdges.clear();refresh();$('search').value='';$('walk').hidden=true;overview();graph.zoomToFit(duration,65)};
$('back').onclick=()=>{const id=history.pop();if(id)showNode(id,true,false);$('back').disabled=!history.length};
}catch(e){$('error').style.display='block';$('error').textContent=e.message+' This view requires a WebGL-enabled browser.';$('status').textContent='3D view unavailable';document.querySelectorAll('#toolbar button,#toolbar select').forEach(el=>el.disabled=true)}
</script></body></html>
